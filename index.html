<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d151d">
<title>Session — gym workout builder</title>
<style>*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#0d151d; --bg2:#121d28; --panel:#16222f; --panel2:#1c2b3a;
  --line:#26374a; --line2:#31465d;
  --ink:#e9f0f7; --ink2:#a8bacd; --ink3:#75899e;
  --beg:#4fb477; --int:#f0b429; --adv:#e0503f;
  --hot:#f2634a; --go:#4fb477; --key:#ffd166;
  --shadow:0 12px 28px rgba(0,0,0,.45);
  --r:14px;
  --tap:52px;
  color-scheme:dark;
}
[data-theme="light"]{
  --bg:#eef1f5; --bg2:#e4e9ef; --panel:#ffffff; --panel2:#f3f6f9;
  --line:#d3dbe4; --line2:#c0cbd8;
  --ink:#15202b; --ink2:#4a5c6e; --ink3:#6b7d90;
  --hot:#d1402a; --go:#2f8f57; --key:#a97400;
  --shadow:0 10px 24px rgba(20,35,50,.13);
  color-scheme:light;
}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:ui-sans-serif,-apple-system,"SF Pro Text","Segoe UI Variable Text","Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px; line-height:1.45;
  font-variant-numeric:tabular-nums;
  -webkit-text-size-adjust:100%;
  padding-bottom:150px;
  overscroll-behavior-y:none;
}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.015em}
button{font:inherit;color:inherit;font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--key);outline-offset:2px;border-radius:8px}

/* ---------- header ---------- */
header.top{
  position:sticky;top:0;z-index:40;
  background:linear-gradient(180deg,var(--bg) 72%,transparent);
  padding:14px 0 10px;
}
.topbar{display:flex;align-items:center;gap:12px}
.mark{display:flex;align-items:baseline;gap:9px;flex:1;min-width:0}
.mark b{font-size:21px;font-weight:700;letter-spacing:-.02em}
.mark span{font-size:13px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{
  width:var(--tap);height:var(--tap);flex:0 0 auto;border-radius:13px;
  background:var(--panel);border:1px solid var(--line);
  display:grid;place-items:center;cursor:pointer;
}
.iconbtn:active{background:var(--panel2)}

/* ---------- picker ---------- */
.picker{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:14px;margin-bottom:14px;box-shadow:var(--shadow);
}
.picker label{display:block;font-size:14px;color:var(--ink2);margin-bottom:9px}
.selrow{display:flex;gap:10px}
.sel{
  position:relative;flex:1;
}
select{
  -webkit-appearance:none;appearance:none;width:100%;
  height:60px;padding:0 44px 0 16px;
  background:var(--panel2);color:var(--ink);
  border:1px solid var(--line2);border-radius:12px;
  font-size:18px;font-weight:600;letter-spacing:-.01em;
}
.sel::after{
  content:"";position:absolute;right:18px;top:50%;width:11px;height:11px;
  border-right:2.5px solid var(--ink2);border-bottom:2.5px solid var(--ink2);
  transform:translateY(-70%) rotate(45deg);pointer-events:none;
}
.build{
  height:60px;padding:0 20px;border-radius:12px;border:none;cursor:pointer;
  background:var(--ink);color:var(--bg);font-weight:700;font-size:16px;
}
.build:active{opacity:.82}

/* ---------- session meta ---------- */
.meta{
  display:flex;gap:10px;margin-bottom:14px;
}
.stat{
  flex:1;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r);padding:11px 13px;min-width:0;
}
.stat .v{font-size:23px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.stat .k{font-size:12.5px;color:var(--ink3);margin-top:2px}
.stat.warn{border-color:var(--hot)}
.stat.warn .v{color:var(--hot)}
.bar{height:7px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--go);width:0;transition:width .3s ease}

.stylecard{
  background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--key);
  border-radius:var(--r);padding:12px 14px;margin-bottom:16px;
}
.stylecard b{font-size:15.5px}
.stylecard p{margin:3px 0 0;font-size:14px;color:var(--ink2)}

.notice{
  background:rgba(242,99,74,.12);border:1px solid var(--hot);color:var(--ink);
  border-radius:12px;padding:11px 13px;margin-bottom:14px;font-size:14.5px;
  display:flex;gap:9px;align-items:flex-start;
}
.notice button{background:none;border:none;color:var(--ink3);cursor:pointer;padding:0 2px;font-size:19px;line-height:1}

/* ---------- sections ---------- */
.sechead{
  display:flex;align-items:center;gap:10px;
  margin:22px 2px 11px;
}
.sechead h2{font-size:15px;letter-spacing:.01em;color:var(--ink)}
.sechead .dur{margin-left:auto;font-size:13.5px;color:var(--ink3)}
.rule{flex:0 0 26px;height:3px;border-radius:2px;background:var(--line2)}

.simple{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.srow{
  display:flex;align-items:center;gap:12px;padding:12px 14px;
  border-top:1px solid var(--line);min-height:56px;
}
.srow:first-child{border-top:none}
.srow .sv{flex:0 0 46px;height:46px;background:var(--panel2);border-radius:10px;display:grid;place-items:center;overflow:hidden}
.srow .sv svg{width:100%;height:100%}
.srow .nm{flex:1;font-size:15.5px;font-weight:560;min-width:0}
.srow .nm em{display:block;font-style:normal;font-size:13px;color:var(--ink3);font-weight:400;margin-top:1px}
.srow .tm{font-size:14px;color:var(--ink2);font-weight:600;white-space:nowrap}

/* ---------- exercise card ---------- */
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  margin-bottom:12px;overflow:hidden;
}
.card.done{border-color:var(--go)}
.card.done .cname{color:var(--ink3);text-decoration:line-through;text-decoration-thickness:1.5px}
.chead{display:flex;gap:12px;padding:13px 13px 0}
.slot{
  flex:0 0 30px;height:30px;border-radius:9px;background:var(--panel2);
  color:var(--ink2);font-size:14px;font-weight:700;display:grid;place-items:center;
}
.card.done .slot{background:var(--go);color:#06210f}
.ctitle{flex:1;min-width:0}
.cname{font-size:19px;font-weight:680;letter-spacing:-.02em;line-height:1.22;margin:1px 0 0}
.tag{
  display:inline-block;margin-top:7px;font-size:12px;font-weight:700;
  padding:3px 8px;border-radius:6px;background:var(--panel2);color:var(--ink2);
}
.tag.style{background:rgba(255,209,102,.16);color:var(--key)}
.swap{
  flex:0 0 var(--tap);height:var(--tap);margin-top:-8px;border-radius:13px;
  background:transparent;border:1px solid var(--line);display:grid;place-items:center;cursor:pointer;
}
.swap:active{background:var(--panel2)}

.cbody{display:flex;gap:12px;padding:11px 13px 0;align-items:flex-start}
.viz{
  flex:0 0 116px;height:96px;background:var(--bg2);border:1px solid var(--line);
  border-radius:11px;overflow:hidden;
}
.viz svg{width:100%;height:100%;display:block}
.pres{flex:1;min-width:0}
.big{font-size:25px;font-weight:730;letter-spacing:-.03em;line-height:1.1}
.big small{font-size:14px;font-weight:600;color:var(--ink3);letter-spacing:0}
.sub{font-size:14px;color:var(--ink2);margin-top:5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.chip{
  font-size:12.5px;padding:4px 9px;border-radius:7px;
  background:var(--panel2);border:1px solid var(--line);color:var(--ink2);white-space:nowrap;
}
.chip.d{border-color:transparent;font-weight:700;color:#0d151d}
.chip.d.Beginner{background:var(--beg)}
.chip.d.Intermediate{background:var(--int)}
.chip.d.Advanced{background:var(--adv);color:#fff}
[data-theme="light"] .chip.d.Beginner,[data-theme="light"] .chip.d.Intermediate{color:#12202c}

.cues{margin:11px 13px 0;padding:11px 12px;background:var(--bg2);border-radius:11px}
.cues li{font-size:14px;color:var(--ink2);margin:0 0 5px;line-height:1.4}
.cues li:last-child{margin:0}
.cues ul{margin:0;padding-left:17px}

.cfoot{display:flex;gap:9px;padding:12px 13px 13px;flex-wrap:wrap}
.act{
  height:var(--tap);border-radius:12px;border:1px solid var(--line);
  background:var(--panel2);cursor:pointer;padding:0 15px;font-size:15px;font-weight:600;
  display:flex;align-items:center;gap:8px;
}
.act:active{opacity:.8}
.act.prime{flex:1;justify-content:center;background:var(--panel2)}
.card.done .act.prime{background:var(--go);color:#06210f;border-color:var(--go);font-weight:700}
.act.rest{background:transparent;color:var(--ink2)}

.log{padding:0 13px 13px}
.logtable{width:100%;border-collapse:collapse}
.logtable th{font-size:12px;color:var(--ink3);font-weight:600;text-align:left;padding:0 0 6px}
.logtable td{padding:0 0 8px}
.logtable td:first-child{width:34px;color:var(--ink3);font-size:14px;font-weight:700}
.logtable input{
  width:100%;height:46px;background:var(--bg2);border:1px solid var(--line);
  border-radius:10px;color:var(--ink);font-size:16px;font-weight:600;
  padding:0 11px;font-variant-numeric:tabular-nums;
}
.logtable input:focus{border-color:var(--key);outline:none}
.logtable .sep{width:9px}

/* ---------- bottom bar ---------- */
.dock{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:var(--panel);border-top:1px solid var(--line);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  box-shadow:0 -8px 24px rgba(0,0,0,.3);
}
.dockin{max-width:640px;margin:0 auto;display:flex;gap:10px;align-items:center}
.dockstat{flex:1;min-width:0}
.dockstat .v{font-size:17px;font-weight:700;line-height:1.1}
.dockstat .k{font-size:12px;color:var(--ink3)}
.dockstat.warn .v{color:var(--hot)}
.dbtn{
  height:var(--tap);border-radius:13px;border:1px solid var(--line);background:var(--panel2);
  padding:0 16px;font-size:15px;font-weight:650;cursor:pointer;display:flex;align-items:center;gap:8px;
}
.dbtn.timer{background:var(--hot);border-color:var(--hot);color:#fff}
.dbtn:active{opacity:.85}

/* ---------- timer sheet ---------- */
.sheet{
  position:fixed;inset:0;z-index:60;background:rgba(4,9,14,.72);
  display:none;align-items:flex-end;justify-content:center;
}
.sheet.on{display:flex}
.sheetin{
  width:100%;max-width:640px;background:var(--panel);
  border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line2);
}
.grab{width:44px;height:5px;border-radius:99px;background:var(--line2);margin:0 auto 14px}
.ring{position:relative;width:216px;height:216px;margin:2px auto 14px}
.ring svg{transform:rotate(-90deg)}
.ring .num{
  position:absolute;inset:0;display:grid;place-items:center;text-align:center;
}
.ring .num b{font-size:52px;font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.ring .num i{display:block;font-style:normal;font-size:13px;color:var(--ink3);margin-top:2px}
.presets{display:flex;gap:8px;margin-bottom:12px}
.presets button{
  flex:1;height:var(--tap);border-radius:12px;border:1px solid var(--line);
  background:var(--panel2);font-size:15px;font-weight:650;cursor:pointer;
}
.presets button.on{border-color:var(--key);color:var(--key)}
.tctl{display:flex;gap:9px}
.tctl button{flex:1;height:58px;border-radius:13px;border:1px solid var(--line);background:var(--panel2);font-size:16px;font-weight:700;cursor:pointer}
.tctl button.go{background:var(--hot);border-color:var(--hot);color:#fff}

/* ---------- history / empty ---------- */
.empty{
  text-align:center;padding:44px 20px;color:var(--ink2);
}
.empty h3{font-size:19px;margin-bottom:8px;color:var(--ink)}
.empty p{margin:0;font-size:15px;line-height:1.5}
.hist{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;font-size:14px;color:var(--ink2)}
.hist b{color:var(--ink);font-size:14.5px;display:block;margin-bottom:6px}
.hist div{padding:5px 0;border-top:1px solid var(--line)}
.hist div:first-of-type{border-top:none}
.finish{
  width:100%;height:58px;margin-top:6px;border-radius:13px;cursor:pointer;
  background:var(--go);border:none;color:#06210f;font-size:16px;font-weight:750;
}
.ghost{
  width:100%;height:var(--tap);margin-top:9px;border-radius:12px;cursor:pointer;
  background:transparent;border:1px solid var(--line);color:var(--ink2);font-size:15px;font-weight:600;
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:359px){.viz{flex-basis:96px;height:84px}.big{font-size:22px}}

/* ---------- svg illustration classes ---------- */
svg .lm{stroke:var(--ink);stroke-width:5}
svg .lb{stroke:var(--ink3);stroke-width:4.5}
svg .tq{stroke:var(--ink);stroke-width:8}
svg .hd{stroke:var(--ink);stroke-width:4.5;fill:none}
svg .gp{stroke:var(--line2);stroke-width:3}
svg .pr{stroke:var(--line2);stroke-width:3.5;fill:none}
svg .eq{stroke:var(--key);stroke-width:4.5}
svg .eq.f{fill:var(--key);stroke:none}
svg .cb{stroke:var(--key);stroke-width:2.5;stroke-dasharray:7 5}
svg .bd{stroke:var(--key);stroke-width:3}
svg .rp{stroke:var(--key);stroke-width:2.5}
.srow .sv svg .lm,.srow .sv svg .tq{stroke:var(--ink2)}

/* ---------- form-video links ---------- */
.act.vid{
  text-decoration:none;color:var(--ink2);flex:0 0 auto;gap:7px;
  padding:0 14px;font-weight:600;
}
.act.vid:active{opacity:.75}
a.srow{text-decoration:none;color:inherit;-webkit-tap-highlight-color:transparent}
a.srow:active{background:var(--panel2)}
.srow .tm{margin-left:auto}
.srow .go{
  flex:0 0 38px;height:38px;border-radius:10px;background:var(--panel2);
  border:1px solid var(--line);display:grid;place-items:center;color:var(--ink3);
}
@media (max-width:359px){
  .act.vid{padding:0 11px}
  .srow .go{flex-basis:34px;height:34px}
}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{
  flex:1;height:48px;border-radius:12px;cursor:pointer;
  background:transparent;border:1px solid var(--line);color:var(--ink3);
  font-size:14.5px;font-weight:640;
}
.tab.on{background:var(--panel);color:var(--ink);border-color:var(--line2)}

/* ---------- mode switch ---------- */
.seg{display:flex;gap:6px;padding:5px;background:var(--bg2);border-radius:13px;margin-bottom:14px}
.seg button{
  flex:1;height:46px;border-radius:9px;border:none;cursor:pointer;
  background:transparent;color:var(--ink3);font-size:15px;font-weight:640;
}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.3)}

.pickhint{font-size:13px;color:var(--ink3);margin:14px 0 8px}
.pillrow{display:flex;gap:7px}
.pillrow.wrap{flex-wrap:wrap;margin-bottom:2px}
.pill{
  flex:1 0 auto;min-height:44px;padding:0 14px;border-radius:11px;cursor:pointer;
  background:var(--panel2);border:1px solid var(--line);color:var(--ink2);
  font-size:14px;font-weight:600;
}
.pill.on{border-color:var(--key);color:var(--key);background:transparent}

/* ---------- muscle picker ---------- */
.mgrid{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.mchip{
  flex:1 0 30%;min-height:54px;border-radius:12px;cursor:pointer;
  background:var(--panel2);border:1px solid var(--line);color:var(--ink);
  font-size:15px;font-weight:620;display:flex;align-items:center;justify-content:center;gap:7px;
}
.mchip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mchip i{
  font-style:normal;font-size:12px;font-weight:800;width:20px;height:20px;border-radius:50%;
  background:var(--key);color:#1a1300;display:grid;place-items:center;
}
.toggle{
  width:100%;min-height:52px;margin-top:12px;border-radius:12px;cursor:pointer;text-align:left;
  background:var(--panel2);border:1px solid var(--line);color:var(--ink2);
  font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:11px;padding:0 13px;
}
.toggle.on{color:var(--ink);border-color:var(--go)}
.toggle .box{
  flex:0 0 24px;height:24px;border-radius:7px;border:1.5px solid var(--line2);
  display:grid;place-items:center;font-size:14px;color:var(--go);
}
.toggle.on .box{border-color:var(--go)}

/* ---------- coach's note ---------- */
.advice{
  margin-top:16px;padding:13px 14px;border-radius:12px;
  background:var(--bg2);border:1px solid var(--line);border-left:4px solid var(--go);
}
.advice.caution{border-left-color:var(--int)}
.advice.rethink{border-left-color:var(--hot)}
.advice b{font-size:15.5px}
.advice .seq{
  font-size:13px;color:var(--ink3);margin:4px 0 9px;font-weight:600;letter-spacing:.02em;
}
.advice ul{margin:0;padding-left:17px}
.advice li{font-size:14px;color:var(--ink2);line-height:1.45;margin-bottom:6px}
.advice li:last-child{margin-bottom:0}
.advice.compact{margin:0 0 16px}
.build.wide{width:100%;margin-top:14px}
.build.off{background:var(--panel2);color:var(--ink3);border:1px solid var(--line)}

/* ---------- muscle tag on cards ---------- */
.mtag{
  display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink3);margin-bottom:2px;
}

/* ---------- library ---------- */
.libitem{border-top:1px solid var(--line)}
.libitem:first-child{border-top:none}
.libitem.open{background:var(--bg2)}
.librow{
  width:100%;min-height:60px;display:flex;align-items:center;gap:11px;
  padding:11px 14px;background:transparent;border:none;cursor:pointer;text-align:left;
}
.librow .nm{flex:1;font-size:15.5px;font-weight:580;min-width:0}
.librow .nm em{display:block;font-style:normal;font-size:12.5px;color:var(--ink3);font-weight:400;margin-top:1px}
.librow .caret{font-size:20px;color:var(--ink3);width:18px;text-align:center}
.libbody{display:flex;gap:12px;padding:0 14px 14px;align-items:flex-start}
.libbody .viz{flex:0 0 106px;height:88px}
.libinfo{flex:1;min-width:0}
.cuelist{margin:9px 0 11px;padding-left:16px}
.cuelist li{font-size:13.5px;color:var(--ink2);line-height:1.4;margin-bottom:4px}
.libinfo .act.vid{display:inline-flex;height:46px;border:1px solid var(--line);border-radius:11px;background:var(--panel2)}

/* ---------- data sheet ---------- */
.dhead{font-size:20px;margin-bottom:12px}
.dnum{background:var(--bg2);border-radius:12px;padding:4px 13px;margin-bottom:14px}
.drow{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:14.5px;color:var(--ink2)}
.drow:first-child{border-top:none}
.drow b{margin-left:auto;color:var(--ink);font-weight:640;text-align:right}
.dwarn{margin:0 0 12px;padding:11px 13px;border-radius:11px;background:rgba(242,99,74,.12);
  border:1px solid var(--hot);font-size:13.5px;line-height:1.45}
.dmsg{margin:0 0 12px;padding:11px 13px;border-radius:11px;background:var(--bg2);
  border:1px solid var(--go);font-size:13.5px;line-height:1.45;color:var(--ink)}
.dact{
  display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;
  margin-bottom:9px;border-radius:13px;cursor:pointer;font-size:15.5px;font-weight:650;
  background:var(--panel2);border:1px solid var(--line);color:var(--ink);
}
.dact:active{opacity:.82}
.dact.quiet{color:var(--ink3);font-weight:600}
.dact.danger{border-color:var(--hot);color:var(--hot)}
</style>
</head>
<body>

<header class="top">
  <div class="wrap topbar">
    <div class="mark"><b>Session</b><span id="today"></span></div>
    <button class="iconbtn" data-act="opendata" aria-label="Data and backup">

function plate(x,y,vert){
  return vert
    ? '<rect class="eq f" x="'+(x-13)+'" y="'+(y-5)+'" width="26" height="10" rx="4"/>'
    : '<rect class="eq f" x="'+(x-5)+'" y="'+(y-13)+'" width="10" height="26" rx="4"/>';
}

function drawEquip(ex,pose){
  var e=pose.e, s="", q=ex.equip;
  if(!e) e=pose.hn;
  var x=e[0], y=e[1];
  var vert = pose.a===90;

  if(q==="bb"){
    if(vert) s+='<path class="eq" d="M'+x+' '+(y-30)+'V'+(y+30)+'"/>'+plate(x,y-27,1)+plate(x,y+27,1);
    else     s+='<path class="eq" d="M'+(x-31)+' '+y+'H'+(x+31)+'"/>'+plate(x-28,y)+plate(x+28,y);
  }
  else if(q==="db"){
    var pts = pose.front ? [pose.hn,pose.hn2] : [e];
    pts.forEach(function(h){
      if(!h) return;
      s+='<path class="eq" d="M'+(h[0]-11)+' '+h[1]+'H'+(h[0]+11)+'"/>'
        +'<rect class="eq f" x="'+(h[0]-15)+'" y="'+(h[1]-8)+'" width="7" height="16" rx="2.5"/>'
        +'<rect class="eq f" x="'+(h[0]+8)+'" y="'+(h[1]-8)+'" width="7" height="16" rx="2.5"/>';
    });
  }
  else if(q==="kb"){
    s+='<path class="eq" d="M'+(x-7)+' '+(y+2)+'a7 8 0 0 1 14 0"/>'
      +'<circle class="eq f" cx="'+x+'" cy="'+(y+13)+'" r="10"/>';
  }
  else if(q==="cbl"){
    var an=pose.c||[186,20];
    s+='<path class="cb" d="M'+x+' '+y+'L'+an[0]+' '+an[1]+'"/><circle class="eq f" cx="'+an[0]+'" cy="'+an[1]+'" r="5"/>';
    if(pose.c2 && pose.hn2){
      s+='<path class="cb" d="M'+pose.hn2[0]+' '+pose.hn2[1]+'L'+pose.c2[0]+' '+pose.c2[1]+'"/><circle class="eq f" cx="'+pose.c2[0]+'" cy="'+pose.c2[1]+'" r="5"/>';
    }
    var sx = an[0]>100?178:14;
    s+='<rect class="pr" x="'+(sx-11)+'" y="'+(an[1]<70?58:34)+'" width="22" height="48" rx="4"/>'
      +'<path class="pr" d="M'+(sx-11)+' '+(an[1]<70?74:50)+'h22M'+(sx-11)+' '+(an[1]<70?90:66)+'h22"/>'
      +'<path class="eq" d="M'+(x)+' '+(y)+'m-9 0h18"/>';
  }
  else if(q==="band"){
    var ab=pose.bandTo||pose.c||[186,120];
    var mx=(x+ab[0])/2, my=(y+ab[1])/2;
    s+='<path class="bd" d="M'+x+' '+y+'Q'+(mx+8)+' '+(my-10)+' '+ab[0]+' '+ab[1]+'"/>'
      +'<path class="bd" d="M'+x+' '+(y+3)+'Q'+(mx+8)+' '+(my-6)+' '+ab[0]+' '+(ab[1]+3)+'"/>';
    if(pose.c2 && pose.hn2){
      var b2=pose.c2, m2x=(pose.hn2[0]+b2[0])/2, m2y=(pose.hn2[1]+b2[1])/2;
      s+='<path class="bd" d="M'+pose.hn2[0]+' '+pose.hn2[1]+'Q'+(m2x-8)+' '+(m2y-10)+' '+b2[0]+' '+b2[1]+'"/>';
    }
  }
  else if(q==="mch"){
    if(!pose.self){
      s+='<path class="pr" d="M180 16v110M180 34h-24"/><rect class="pr" x="169" y="48" width="22" height="46" rx="4"/><path class="pr" d="M169 64h22M169 80h22"/>';
      if(pose.e) s+='<path class="eq" d="M'+(x-11)+' '+y+'h22"/>';
    } else if(pose.e){
      s+='<path class="eq" d="M'+(x-11)+' '+y+'h22"/>';
    }
  }
  else if(q==="oth"){
    if(pose.wheel) s+='<circle class="eq" cx="'+x+'" cy="'+y+'" r="9"/><path class="eq" d="M'+(x-13)+' '+y+'h26"/>';
    else s+='<circle class="eq f" cx="'+x+'" cy="'+y+'" r="10"/>';
  }
  return s;
}

/* main renderer */
function exSVG(ex){
  var key = ex.pattern;
  if(ex.group==="cardio" && key==="row") key="erg";
  var pose = POSE[key] || POSE.stretch;
  var far  = '';
  var near = '';

  if(pose.kn2) far += svgLine(pose.hp,pose.kn2,"lb")+svgLine(pose.kn2,pose.ft2,"lb");
  if(pose.el2) far += svgLine(pose.nk,pose.el2,"lb")+svgLine(pose.el2,pose.hn2,"lb");

  near += svgLine(pose.hp,pose.kn,"lm")+svgLine(pose.kn,pose.ft,"lm");
  near += svgLine(pose.nk,pose.hp,"tq");
  near += '<circle class="hd" cx="'+pose.hd[0]+'" cy="'+pose.hd[1]+'" r="9"/>';
  near += svgLine(pose.nk,pose.hd,"lm");
  near += svgLine(pose.nk,pose.el,"lm")+svgLine(pose.el,pose.hn,"lm");

  var eq = (ex.equip==="bw" && !pose.wheel) ? "" : drawEquip(ex,pose);
  if(ex.equip==="bw" && ex.pattern==="rollout") eq = drawEquip({equip:"oth"},pose);

  return '<svg viewBox="0 0 200 140" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">'
    + '<g fill="none" stroke-linecap="round" stroke-linejoin="round">'
    + drawProps(pose.p,pose,ex)
    + far + near + eq
    + '</g></svg>';
}

/* thumbnails for warm-up / cooldown rows use the same engine */
function miniSVG(pattern){
  return exSVG({pattern:pattern,equip:"bw",group:"x"});
}

<script>/* ============================================================
   ADVANCED MODE
   Multi-muscle sessions, with the programming opinions a
   coach would actually give you on the gym floor.
   ============================================================ */

var MUSCLES = ["chest","back","shoulders","biceps","triceps","legs","core"];

var SHORT = {chest:"Chest",back:"Back",shoulders:"Shoulders",biceps:"Biceps",
             triceps:"Triceps",legs:"Legs",core:"Core",cardio:"Cardio",fullbody:"Full body"};

/* relative volume a muscle deserves in a shared session */
var SIZE = {chest:1,back:1.05,legs:1.15,shoulders:.9,biceps:.55,triceps:.55,core:.6};

/* the order a coach would train them in: biggest and most demanding first */
var RANK = {legs:1,back:2,chest:3,shoulders:4,triceps:5,biceps:6,core:9};

/* which muscles get worked as a by-product of training the key */
var OVERLAP = {chest:["triceps","shoulders"],back:["biceps","shoulders"],
               shoulders:["triceps"],legs:["core"],biceps:[],triceps:[],core:[]};

var ANTAGONIST = [["chest","back"],["biceps","triceps"],["shoulders","back"]];

var PRESETS = [
  {name:"Push",       sel:["chest","shoulders","triceps"]},
  {name:"Pull",       sel:["back","biceps"]},
  {name:"Legs + Core",sel:["legs","core"]},
  {name:"Upper",      sel:["chest","back","shoulders"]},
  {name:"Arms",       sel:["biceps","triceps"]},
  {name:"Chest + Back",sel:["chest","back"]}
];

/* hand-written notes for the pairings that come up most */
var PAIR_NOTES = {
 "chest+triceps":"Textbook push pairing. The triceps are already warm from every press, so they need finishing work at the end, not a session of their own. Press first, always.",
 "back+biceps":"Textbook pull pairing. Get every row and pulldown done before the first curl — biceps fatigued early will cap what your back can pull.",
 "back+chest":"Antagonist pairing, and the most time-efficient way to train upper body. Alternating a press with a row lets each recover while the other works.",
 "biceps+triceps":"Arm day. Alternate them — one flexes while the other rests, so almost nothing is wasted.",
 "shoulders+triceps":"Both take a beating from overhead pressing. Watch the total pressing volume, or the triceps will quit before the delts get their work.",
 "chest+shoulders":"Heavy overlap at the front delt. Lead with whichever matters more this week and keep the second one to raises rather than more pressing.",
 "core+legs":"Sensible pairing. Core goes last, always — a fatigued trunk makes heavy squats and hinges less safe, not more.",
 "back+legs":"The most demanding combination there is. Both hammer the lower back and the grip. Do legs first, then pick chest-supported or machine rows so the erectors get a break.",
 "legs+shoulders":"Unusual, but nothing competes, so both get full effort. The only cost is a long session — keep the rest periods honest.",
 "biceps+chest":"Nothing competes here, which is the whole point. Less traditional than push/pull, and perfectly effective.",
 "back+triceps":"Non-competing by design. Your back work will not be limited by tired triceps, and vice versa.",
 "chest+core":"Straightforward. Press first, core last.",
 "back+core":"Fine, as long as core comes last — you want a fresh trunk under the deadlifts and rows, not a fried one.",
 "shoulders+biceps":"Low overlap, easy session to recover from. A good pairing when you are already sore from pressing.",
 "core+shoulders":"Works well. Overhead work needs a braced trunk, so leave the core work until the pressing is done.",
 "core+triceps":"Light session. If this is all you have planned, consider adding a bigger muscle to make the 90 minutes worthwhile.",
 "biceps+legs":"Nothing competes, though it is an odd split. Legs first — you will not have much left afterwards anyway.",
 "legs+triceps":"Nothing competes. Legs first, arms as the finisher."
};

function pairKey(a,b){return [a,b].sort().join("+")}

/* the coach's read on whatever the user has selected */
function advise(sel,finisher){
  var out = {level:"good", head:"", points:[], order:[]};
  if(!sel.length){ out.level="none"; return out }

  var ordered = orderGroups(sel);
  out.order = ordered;

  if(sel.length===1){
    out.head = "Single muscle, full attention.";
    out.points.push("One muscle over 90 minutes means five or six exercises and plenty of sets — the most direct way to drive growth in a lagging area.");
  }

  /* every pair in the selection gets a verdict */
  for(var i=0;i<sel.length;i++) for(var j=i+1;j<sel.length;j++){
    var k = pairKey(sel[i],sel[j]);
    if(PAIR_NOTES[k]) out.points.push(PAIR_NOTES[k]);
    else {
      var a=sel[i], b=sel[j];
      var over = (OVERLAP[a]||[]).indexOf(b)>=0 || (OVERLAP[b]||[]).indexOf(a)>=0;
      out.points.push(over
        ? SHORT[a]+" and "+SHORT[b]+" share work, so the order matters. Train the one you care about more first."
        : SHORT[a]+" and "+SHORT[b]+" do not compete, so both can get real effort in one session.");
    }
  }

  /* back and legs together depends entirely on which you put first */
  if(sel.indexOf("back")>=0 && sel.indexOf("legs")>=0){
    out.points = out.points.filter(function(p){ return p!==PAIR_NOTES["back+legs"] });
    var legsFirst = ordered.indexOf("legs") < ordered.indexOf("back");
    out.points.push(legsFirst
      ? "Back and legs both hammer the lower back and the grip. Legs first is the right call \u2014 just make the rowing chest-supported or machine-based afterwards so the erectors get a break."
      : "Back and legs both hammer the lower back and the grip, and you have put back first. That works if the pulling is the priority, but go easier on the squat and hinge loading afterwards, or reorder if legs are what you actually came for.");
  }

  /* the pressing-overload check */
  var press = ["chest","shoulders","triceps"].filter(function(g){return sel.indexOf(g)>=0}).length;
  if(press===3){
    out.level="caution";
    out.points.push("All three pressing muscles in one session is a lot of overhead and horizontal work. Expect the last two exercises to feel much heavier than the numbers suggest, and drop a set if form goes.");
  }
  if(sel.indexOf("back")>=0 && sel.indexOf("legs")>=0 && out.level==="good") out.level="caution";

  /* too many muscles for the time available */
  if(sel.length>=4){
    out.level="rethink";
    out.points.unshift("Four or more muscles in 90 minutes leaves roughly two exercises each, which is below what most muscles need to actually grow. If you want to hit everything, run Full Body with big compounds instead — you will get more from it.");
  }

  if(sel.indexOf("core")>=0 && sel.length>1)
    out.points.push("Core is programmed last. Nothing else in the session gets safer with a pre-fatigued trunk.");
  if(finisher)
    out.points.push("Conditioning goes after the weights, never before. Ten minutes is enough to matter without eating into tomorrow's recovery.");

  out.head = out.level==="good" ? "This works well."
           : out.level==="caution" ? "Workable, with a caveat."
           : "I would rethink this one.";
  return out;
}

/* train the priority muscle first, then biggest to smallest, core last */
function orderGroups(sel){
  var rest = sel.slice(1).sort(function(a,b){return (RANK[a]||5)-(RANK[b]||5)});
  var first = sel[0];
  if(first==="core" && sel.length>1){ rest.push("core"); return rest }
  return [first].concat(rest);
}

/* split the exercise budget across muscles by size and priority */
function allocate(ordered){
  var n = ordered.length;
  var total = n===1 ? 6 : n===2 ? (SIZE[ordered[0]]>=1 && SIZE[ordered[1]]>=1 ? 7 : 6) : 7;
  var w = ordered.map(function(g,i){ return (SIZE[g]||.7) * (i===0?1.35:1) });
  var sum = w.reduce(function(a,b){return a+b},0);
  var raw = w.map(function(x){ return total*x/sum });
  var out = raw.map(function(x){ return Math.max(1,Math.floor(x)) });
  var used = out.reduce(function(a,b){return a+b},0);
  while(used<total){                       // largest remainder to the biggest share
    var bi=0,bv=-1;
    raw.forEach(function(x,i){ var r=x-out[i]; if(r>bv && out[i]<5){bv=r;bi=i} });
    out[bi]++; used++;
  }
  while(used>total){ var mi=out.indexOf(Math.max.apply(null,out)); out[mi]--; used--; }
  var map={}; ordered.forEach(function(g,i){ map[g]=out[i] });
  return map;
}

var LEVEL_BIAS = {
  any:  {Beginner:0,  Intermediate:0,  Advanced:0},
  inter:{Beginner:-3, Intermediate:1.5,Advanced:1.5},
  adv:  {Beginner:-7, Intermediate:-1, Advanced:4.5}
};

/* pick exercises for a list of {g, role} slots, keeping variety global */
function selectSlots(slots, avoid, level){
  var bias = LEVEL_BIAS[level]||LEVEL_BIAS.any;
  var chosen=[], usedEquip={}, usedPattern={}, taken={};
  var rank = {C:0,c:1,a:2,i:3,t:4,x:5};
  var order = slots.map(function(s,i){return {s:s,i:i}})
                   .sort(function(a,b){return (rank[a.s.role]-rank[b.s.role])||(a.i-b.i)});

  order.forEach(function(o){
    var g=o.s.g, role=o.s.role, pool=LIB[g];
    var fresh = pool.filter(function(e){return avoid.indexOf(e.id)<0 && !taken[e.id]});
    if(fresh.length<4) fresh = pool.filter(function(e){return !taken[e.id]});
    var tiers = FALLBACK[role]||[role], cands=[];
    for(var t=0;t<tiers.length && !cands.length;t++)
      cands = fresh.filter(function(e){return e.role===tiers[t]});
    if(!cands.length) cands = fresh;
    if(!cands.length) return;

    var pats={}; pool.forEach(function(e){pats[e.pattern]=1});
    var patPen = Object.keys(pats).length<=5 ? 1.6 : 4.5;
    var best=null,bs=-1e9;
    shuffle(cands).forEach(function(e){
      var s=Math.random()*3 + (bias[e.diff]||0);
      if(!usedEquip[e.equip]) s+=3.5; else s-=usedEquip[e.equip]*1.6;
      if(usedPattern[e.pattern]) s-=patPen*usedPattern[e.pattern];
      if(e.role===role) s+=1.5;
      if(s>bs){bs=s;best=e}
    });
    taken[best.id]=1;
    usedEquip[best.equip]=(usedEquip[best.equip]||0)+1;
    usedPattern[best.pattern]=(usedPattern[best.pattern]||0)+1;
    o.pick=best;
  });

  return order.sort(function(a,b){return a.i-b.i}).map(function(o){return o.pick}).filter(Boolean);
}

/* ---------- build a multi-muscle session ---------- */
function buildMulti(sel, level, finisher, avoidExtra){
  var ordered = orderGroups(sel);
  var counts  = allocate(ordered);

  var avoid = (avoidExtra||[]).slice();
  ordered.forEach(function(g){
    (S.history[g]||[]).slice(0,2).forEach(function(h){ avoid = avoid.concat(h.ids) });
  });

  var slots=[];
  ordered.forEach(function(g){
    TEMPLATES[g].slice(0,counts[g]).forEach(function(r){ slots.push({g:g,role:r}) });
  });

  var picks = selectSlots(slots, avoid, level);

  /* display order: finish one muscle before starting the next, compounds first */
  var rank={C:0,c:1,a:2,i:3,t:4};
  picks.sort(function(a,b){
    var ga=ordered.indexOf(a.group), gb=ordered.indexOf(b.group);
    return ga-gb || rank[a.role]-rank[b.role];
  });

  var main = picks.map(prescribe);

  if(finisher){
    var cpool = LIB.cardio.filter(function(e){return e.role==="x"});
    var fin = prescribe(pickOne(cpool));
    fin.dur = 60*(8+rnd(3)); fin.lockSets = true; fin.finisher = true;
    relabel(fin); main.push(fin);
  }

  var warm=[], cool=[];
  ordered.forEach(function(g){
    warm = warm.concat(WARMUP[g]||[]);
    cool = cool.concat(COOLDOWN[g]||[]);
  });
  var open = pickOne(WARMUP.general.slice(0,4));
  var wb = buildBlock(warm.concat(WARMUP.general.slice(4)), 540-open[2], 640-open[2]);
  var ses = {
    group: ordered[0], groups: ordered, mode:"multi", level:level, finisher:!!finisher,
    warm: [{name:open[0],pattern:open[1],dur:open[2],note:open[3]}].concat(wb),
    main: main,
    cool: buildBlock(cool.concat(COOLDOWN.general), 520, 620),
    created: Date.now(), saved:false
  };

  var pool = STYLES.filter(function(s){return s.groups==="*" || s.groups==="strength"});
  if(hasAntagonist(ordered)) pool = pool.concat([{id:"antagonist",name:"Antagonist supersets",
    desc:"Two opposing muscles are paired back to back. One works while the other recovers, which buys you time without cutting volume."}]);
  var style = pickOne(pool);
  ses.style=style.id; ses.styleName=style.name; ses.styleDesc=style.desc;

  applyStyle(ses);
  var target = Math.max(60*60, Math.min(73*60, 5400 - warmTime(ses.warm) - warmTime(ses.cool)));
  tune(ses.main, target);
  finalTags(ses);
  return ses;
}

function hasAntagonist(sel){
  return ANTAGONIST.some(function(p){return sel.indexOf(p[0])>=0 && sel.indexOf(p[1])>=0});
}
</script>

<script>/* ============================================================
   SESSION ENGINE
   ============================================================ */
var TARGET_MAIN = 69 * 60;      // seconds of main work we aim for
var SETUP = 45;                 // walk to the station, load, unload
var KEY = "gym:session:v1";

var SPEC = {
  C:{sets:4,reps:[6,8],  rest:150,tempo:4.0},
  c:{sets:4,reps:[8,10], rest:120,tempo:3.5},
  a:{sets:3,reps:[10,12],rest:90, tempo:3.2},
  i:{sets:3,reps:[12,15],rest:60, tempo:3.0},
  t:{sets:3,time:[30,50],rest:45},
  x:{sets:1,time:[480,780],rest:90}
};
var FALLBACK = {C:["C","c","a"],c:["c","C","a"],a:["a","c","i"],i:["i","a","t"],t:["t","i","a"],x:["x"]};
var CAP = {C:{sets:5,rest:180},c:{sets:5,rest:180},a:{sets:6,rest:135},i:{sets:6,rest:120},t:{sets:6,rest:90},x:{sets:1,rest:150}};
function capOf(it){var ex=byId(it.g,it.id);return CAP[ex.role]||CAP.a}

var TEMPLATES = {
  chest:["C","c","a","a","i","i"], back:["C","c","a","a","i","i"],
  shoulders:["C","c","a","i","i","i"], legs:["C","c","a","a","i","i"],
  fullbody:["C","c","c","a","a","i"], biceps:["c","a","a","i","i","i"],
  triceps:["c","a","a","i","i","i"], core:["i","i","t","i","t","i"],
  cardio:["x","x","x","x","x"]
};

var STYLES = [
 {id:"straight",name:"Straight sets",desc:"One exercise at a time, full rest between sets. Chase load on the first two lifts.",groups:"*"},
 {id:"pyramid", name:"Pyramid opener",desc:"The opening lift climbs in weight as the reps come down. Everything after it is straight sets.",groups:"strength"},
 {id:"superset",name:"Paired supersets",desc:"The last two exercises run back to back. Rest only after finishing both.",groups:"strength"},
 {id:"drop",    name:"Drop-set finisher",desc:"On the final exercise, strip about a third of the load on the last set and keep going.",groups:"strength"},
 {id:"restpause",name:"Rest-pause main lift",desc:"After the last set of the opener, rack it, take 15 breaths, then squeeze out a few more reps.",groups:"strength"},
 {id:"circuit", name:"Circuit finisher",desc:"The last three movements run as a circuit. Three rounds, short rest, then done.",groups:"strength"},
 {id:"emom",    name:"Every minute on the minute",desc:"Start each block at the top of a minute. Whatever time is left is your rest.",groups:"cardio"},
 {id:"ladder",  name:"Interval ladder",desc:"Work intervals get longer as the session goes on. Hold the same effort throughout.",groups:"cardio"},
 {id:"pyramidc",name:"Pyramid intervals",desc:"Build up to the hardest block in the middle, then wind back down.",groups:"cardio"}
];

/* ---------- helpers ---------- */
function rnd(n){return Math.floor(Math.random()*n)}
function pickOne(a){return a[rnd(a.length)]}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(i+1),t=a[i];a[i]=a[j];a[j]=t}return a}
function mmss(s){var m=Math.floor(s/60),x=Math.round(s%60);return m+":"+(x<10?"0":"")+x}
function mins(s){return Math.round(s/60)}
function byId(g,id){return LIB[g].filter(function(e){return e.id===id})[0]}

/* ---------- time model ---------- */
function itemTime(it){
  var ex = byId(it.g,it.id);
  if(it.dur) return it.dur + it.rest;
  if(it.time) return it.sets*it.time + it.sets*it.rest + SETUP;
  var reps = it.repAvg || 10;
  var tempo = SPEC[ex.role] ? (SPEC[ex.role].tempo||3.2) : 3.2;
  return Math.round(it.sets*reps*tempo) + it.sets*it.rest + SETUP;
}
function blockTime(list){return list.reduce(function(s,i){return s+itemTime(i)},0)}
function warmTime(list){return list.reduce(function(s,i){return s+i.dur},0)}
function totalTime(ses){
  if(!ses) return 0;
  return warmTime(ses.warm)+blockTime(ses.main)+warmTime(ses.cool);
}

/* ---------- prescription ---------- */
function prescribe(ex){
  var sp = SPEC[ex.role]||SPEC.a;
  var it = {id:ex.id,g:ex.group,sets:sp.sets,rest:sp.rest,done:false,tag:""};
  if(ex.role==="x"){
    it.dur = 60*(8+rnd(6));
    it.rest = pickOne([60,90,120]);
    it.label = Math.round(it.dur/60)+" min";
  } else if(ex.role==="t"){
    it.time = sp.time[0]+rnd(sp.time[1]-sp.time[0]+1);
    it.time = Math.round(it.time/5)*5;
    it.label = it.sets+" × "+it.time+" sec";
  } else {
    var lo = sp.reps[0], hi = sp.reps[1];
    it.repLo=lo; it.repHi=hi; it.repAvg=(lo+hi)/2;
    it.label = it.sets+" × "+lo+"–"+hi;
  }
  return it;
}
function relabel(it){
  if(it.scheme){ it.label = it.scheme; return it; }
  if(it.dur)  it.label = Math.round(it.dur/60)+" min";
  else if(it.time) it.label = it.sets+" × "+it.time+" sec";
  else it.label = it.sets+" × "+it.repLo+"–"+it.repHi;
  return it;
}

/* ---------- selection ---------- */
function selectExercises(group,avoid,count,level){
  var lb = (typeof LEVEL_BIAS!=="undefined" ? LEVEL_BIAS[level||"any"] : null) || {};
  var pool = LIB[group];
  var tpl  = TEMPLATES[group].slice(0,count);
  var fresh = pool.filter(function(e){return avoid.indexOf(e.id)<0});
  if(fresh.length < count+4) fresh = pool.slice();     // pool exhausted, relax

  var pats={}; pool.forEach(function(e){pats[e.pattern]=1});
  var patPenalty = Object.keys(pats).length<=5 ? 1.6 : 4.5;
  var chosen=[], usedEquip={}, usedPattern={};
  tpl.forEach(function(role){
    var tiers = FALLBACK[role]||[role], cands=[];
    for(var t=0;t<tiers.length && !cands.length;t++){
      cands = fresh.filter(function(e){
        return e.role===tiers[t] && chosen.indexOf(e)<0;
      });
    }
    if(!cands.length) cands = fresh.filter(function(e){return chosen.indexOf(e)<0});
    if(!cands.length) return;
    var best=null,bestScore=-1e9;
    shuffle(cands).forEach(function(e){
      var s = Math.random()*3 + (lb[e.diff]||0);
      if(!usedEquip[e.equip]) s += 3.5;
      else s -= usedEquip[e.equip]*1.6;
      if(usedPattern[e.pattern]) s -= patPenalty*usedPattern[e.pattern];
      if(e.role===role) s += 1.5;
      if(s>bestScore){bestScore=s;best=e}
    });
    chosen.push(best);
    usedEquip[best.equip]=(usedEquip[best.equip]||0)+1;
    usedPattern[best.pattern]=(usedPattern[best.pattern]||0)+1;
  });
  return chosen;
}

/* ---------- tuner: land the session near 90 minutes ---------- */
function tune(main,target){
  target = target || TARGET_MAIN;
  for(var pass=0;pass<300;pass++){
    var t = blockTime(main), diff = target - t;
    if(Math.abs(diff)<=120) break;
    var moved=false;
    var order = shuffle(main.slice());
    for(var k=0;k<order.length && !moved;k++){
      var it=order[k], cap=capOf(it);
      if(diff>0){
        if(it.dur && it.dur<1080){ it.dur+=60; moved=true }
        else if(!it.lockSets && it.sets<cap.sets){ it.sets++; moved=true }
        else if(it.time && it.time<60){ it.time=Math.min(60,it.time+5); moved=true }
        else if(!it.lockRest && it.rest<cap.rest){ it.rest=Math.min(cap.rest,it.rest+15); moved=true }
      } else {
        if(it.dur && it.dur>360){ it.dur-=60; moved=true }
        else if(!it.lockSets && it.sets>2){ it.sets--; moved=true }
        else if(!it.lockRest && it.rest>45){ it.rest=Math.max(45,it.rest-15); moved=true }
        else if(it.time && it.time>25){ it.time-=5; moved=true }
      }
      if(moved) relabel(it);
    }
    if(!moved) break;
  }
  return main;
}

/* ---------- style application ---------- */
function applyStyle(ses){
  var all = ses.main, st = ses.style;
  var m = all.filter(function(i){return !i.finisher});
  all.forEach(function(i){ if(i.finisher){ i.tag="Conditioning finisher"; relabel(i) } });
  m.forEach(function(i){i.tag="";i.scheme=null;i.circuit=false;i.lockRest=false;i.lockSets=false;relabel(i)});
  if(st==="pyramid" && m[0] && !m[0].dur && !m[0].time){
    m[0].sets=4; m[0].scheme="12 / 10 / 8 / 6"; m[0].repAvg=9; m[0].tag="Pyramid";
  }
  if(st==="superset" && m.length>=2){
    var a=m[m.length-2], b=m[m.length-1];
    a.tag="Superset A"; b.tag="Superset B";
    a.rest=20; a.lockRest=true; b.rest=Math.max(90,b.rest);
  }
  if(st==="drop"){ var l=m[m.length-1]; if(l){l.tag="Drop set on the last set"} }
  if(st==="restpause" && m[0]){ m[0].tag="Rest-pause on the final set" }
  if(st==="circuit" && m.length>=3){
    m.slice(-3).forEach(function(i){
      i.circuit=true; i.rest=45; i.lockRest=true; relabel(i);
    });
  }
  if(st==="antagonist"){
    var pairA=null,pairB=null;
    for(var x=m.length-1;x>=0 && !pairA;x--){
      for(var y=x-1;y>=0;y--){
        if(m[x].g!==m[y].g && "ai".indexOf(byId(m[x].g,m[x].id).role)>=0 && "ai".indexOf(byId(m[y].g,m[y].id).role)>=0){
          pairA=m[y]; pairB=m[x]; break;
        }
      }
    }
    if(!pairA && m.length>=2){ pairA=m[m.length-2]; pairB=m[m.length-1] }
    if(pairA){
      pairA.tag="Superset A — go straight into B";
      pairB.tag="Superset B — rest after this";
      pairA.rest=20; pairA.lockRest=true; pairB.rest=Math.max(90,pairB.rest);
    }
  }
  if(st==="emom"){ m.forEach(function(i){i.tag="EMOM"}) }
  if(st==="ladder"){ m.forEach(function(i,ix){ i.dur=60*(8+ix); i.tag="Block "+(ix+1); relabel(i) }) }
  if(st==="pyramidc"){
    var mid=Math.floor(m.length/2);
    m.forEach(function(i,ix){ i.dur=60*(9+ (mid-Math.abs(ix-mid))*2); i.tag="Block "+(ix+1); relabel(i) });
  }
  m.forEach(relabel);
  return ses;
}

function finalTags(ses){
  ses.main.forEach(function(i){
    if(i.finisher) i.tag = "Conditioning finisher";
    if(i.circuit) i.tag = "Circuit, " + i.sets + " rounds";
    relabel(i);
  });
}

/* ---------- warm-up and cooldown ---------- */
function buildBlock(pool, lo, hi){
  var picks=[], total=0, bag=shuffle(pool);
  for(var i=0;i<bag.length && total<lo;i++){
    picks.push(bag[i]); total+=bag[i][2];
    if(total>hi && picks.length>2){ total-=picks.pop()[2]; break }
  }
  return picks.map(function(p){return {name:p[0],pattern:p[1],dur:p[2],note:p[3]}});
}
function buildWarmup(g){
  var cardioish = WARMUP.general.slice(0,4);
  var rest = WARMUP.general.slice(4).concat(WARMUP[g]||[]);
  var open = pickOne(cardioish);
  var block = buildBlock(rest, 540-open[2], 640-open[2]);
  return [{name:open[0],pattern:open[1],dur:open[2],note:open[3]}].concat(block);
}
function buildCooldown(g){
  return buildBlock((COOLDOWN[g]||[]).concat(COOLDOWN.general), 520, 620);
}

/* ---------- build a whole session ---------- */
function buildSession(group, avoidIds){
  var hist = (S.history[group]||[]).slice(0,3);
  var avoid = [];
  hist.forEach(function(h){avoid = avoid.concat(h.ids)});
  avoid = avoid.concat(avoidIds||[]);

  var pool = STYLES.filter(function(s){
    return s.groups==="*" || (group==="cardio" ? s.groups==="cardio" : s.groups==="strength");
  });
  var style = pickOne(pool);

  var count = group==="cardio" ? 5
            : style.id==="circuit" ? 6
            : (Math.random()<0.45 ? 5 : 6);

  var warm = buildWarmup(group), cool = buildCooldown(group);
  var picks = selectExercises(group, avoid, count, S.level);

  var ses = {
    group:group, style:style.id, styleName:style.name, styleDesc:style.desc,
    warm:warm, main:picks.map(prescribe), cool:cool,
    created:Date.now(), saved:false
  };
  applyStyle(ses);
  var target = Math.max(62*60, Math.min(73*60, 5400 - warmTime(warm) - warmTime(cool)));
  tune(ses.main, target);
  finalTags(ses);
  return ses;
}

/* ---------- swap one exercise ---------- */
function swapOne(idx){
  var ses = S.session, cur = ses.main[idx];
  var ex = byId(cur.g,cur.id);
  var g  = cur.g;                       // swap within this exercise's own muscle
  var before = totalTime(ses);
  var inSession = ses.main.map(function(i){return i.id});
  var avoid = inSession.slice();
  (S.history[g]||[]).slice(0,3).forEach(function(h){avoid=avoid.concat(h.ids)});

  var bias = (typeof LEVEL_BIAS!=="undefined" ? LEVEL_BIAS[S.level||"any"] : null) || {};
  var tiers = FALLBACK[ex.role]||[ex.role], cands=[];
  for(var t=0;t<tiers.length && !cands.length;t++){
    cands = LIB[g].filter(function(e){
      return e.role===tiers[t] && avoid.indexOf(e.id)<0;
    });
  }
  if(!cands.length) cands = LIB[g].filter(function(e){return inSession.indexOf(e.id)<0});
  if(!cands.length) return null;

  var others = ses.main.filter(function(i,k){return k!==idx}).map(function(i){return byId(i.g,i.id)});
  var best=null,bs=-1e9;
  shuffle(cands).forEach(function(e){
    var s=Math.random()*3 + (bias[e.diff]||0);
    if(others.some(function(o){return o.pattern===e.pattern})) s-=4;
    if(!others.some(function(o){return o.equip===e.equip})) s+=3;
    if(e.equip===ex.equip) s-=1.5;
    if(s>bs){bs=s;best=e}
  });
  var fresh = prescribe(best);
  fresh.sets = cur.sets; fresh.rest = cur.rest;
  if(cur.dur && fresh.dur) fresh.dur = cur.dur;
  fresh.finisher = cur.finisher; fresh.lockSets = cur.lockSets;
  relabel(fresh);
  ses.main[idx]=fresh;
  applyStyle(ses);
  finalTags(ses);
  var after = totalTime(ses);
  return {name:best.name, delta:after-before, total:after};
}

/* ============================================================
   STATE + STORAGE
   ============================================================ */
var S = {theme:"dark", group:"", session:null, history:{}, logs:{},
         view:"session", mode:"single", sel:[], level:"any", finisher:false,
         bf:{g:"chest",eq:"all",lv:"all"}, open:""};
var saveTimer=null, lastSaved=0;

/* Storage picks the best free option available, in order:
   1. Claude's artifact storage, when the app runs inside claude.ai
   2. the browser's own localStorage, when you open the file yourself
   3. memory, which survives nothing — but at least never errors        */
var MEM={};
var STORE = (function(){
  try{
    if(window.storage && window.storage.get && window.storage.set){
      return {
        name:"Claude artifact storage", warn:"Tied to this chat. Export a backup before you rely on it.",
        get:function(k){ return window.storage.get(k).then(function(r){return r&&r.value}).catch(function(){return null}) },
        set:function(k,v){ return window.storage.set(k,v) }
      };
    }
  }catch(e){}
  try{
    var t="__probe__";
    window.localStorage.setItem(t,"1"); window.localStorage.removeItem(t);
    return {
      name:"this browser", warn:"",
      get:function(k){ return Promise.resolve(window.localStorage.getItem(k)) },
      set:function(k,v){ window.localStorage.setItem(k,v); return Promise.resolve() }
    };
  }catch(e){}
  return {
    name:"this tab only", warn:"Nothing will survive a refresh here. Export a backup or open the file from a browser.",
    get:function(k){ return Promise.resolve(MEM[k]||null) },
    set:function(k,v){ MEM[k]=v; return Promise.resolve() }
  };
})();

function snapshot(){
  return {
    v:1, exported:Date.now(),
    theme:S.theme, group:S.group, session:S.session, history:S.history, logs:S.logs,
    mode:S.mode, sel:S.sel, level:S.level, finisher:S.finisher, bf:S.bf
  };
}
function adopt(d){
  if(!d) return;
  S.theme=d.theme||S.theme; S.group=d.group||S.group;
  S.session=d.session||S.session; S.history=d.history||{}; S.logs=d.logs||{};
  S.mode=d.mode||S.mode; S.sel=d.sel||S.sel; S.level=d.level||S.level;
  S.finisher=!!d.finisher; S.bf=d.bf||S.bf;
}

function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){
    try{
      var p = STORE.set(KEY, JSON.stringify(snapshot()));
      lastSaved = Date.now();
      if(p && p.catch) p.catch(function(){});
    }catch(e){}
  },350);
}
async function load(){
  try{
    var raw = await STORE.get(KEY);
    if(raw) adopt(JSON.parse(raw));
  }catch(e){}
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function(){}) }catch(e){}
}

/* ---------- backup file in, backup file out ---------- */
function exportData(){
  var name = "gym-backup-"+new Date().toISOString().slice(0,10)+".json";
  var text = JSON.stringify(snapshot(),null,2);
  try{
    var blob = new Blob([text],{type:"application/json"});
    var url  = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href=url; a.download=name; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove() },400);
    return true;
  }catch(e){
    try{
      var wn = window.open("","_blank");
      wn.document.write("<pre>"+text.replace(/</g,"&lt;")+"</pre>");
      return true;
    }catch(e2){ return false }
  }
}

/* merge rather than overwrite, so two devices can both contribute */
function mergeData(d){
  if(!d || typeof d!=="object") throw new Error("not a backup file");
  var added={logs:0,sessions:0};
  Object.keys(d.logs||{}).forEach(function(id){
    var mine=S.logs[id], theirs=d.logs[id];
    if(!mine || (theirs.d||0) > (mine.d||0)){ S.logs[id]=theirs; added.logs++ }
  });
  Object.keys(d.history||{}).forEach(function(g){
    var all = (S.history[g]||[]).concat(d.history[g]||[]);
    var seen={}, out=[];
    all.sort(function(a,b){return (b.d||0)-(a.d||0)}).forEach(function(h){
      if(seen[h.d]) return; seen[h.d]=1; out.push(h);
    });
    added.sessions += out.length - (S.history[g]||[]).length;
    S.history[g] = out.slice(0,3);
  });
  if(!S.session && d.session) S.session = d.session;
  if(d.logs && Object.keys(d.logs).length && d.theme) S.theme = S.theme;
  save();
  return added;
}

function wipeData(){
  S.session=null; S.history={}; S.logs={}; S.sel=[]; S.group="";
  save();
}

function commitHistory(){
  var ses=S.session; if(!ses||ses.saved) return;
  var groups = ses.groups || [ses.group];
  groups.forEach(function(g){
    var ids = ses.main.filter(function(i){return i.g===g}).map(function(i){return i.id});
    if(!ids.length) return;
    S.history[g] = ([{d:Date.now(),ids:ids}]).concat(S.history[g]||[]).slice(0,3);
  });
  ses.saved=true; save();
}

  }
  if(ses){
    var t=totalTime(ses), w=Math.abs(t-5400)>6*60;
    d.innerHTML = '<div class="dockin">'
      + '<div class="dockstat'+(w?" warn":"")+'"><div class="v">'+mins(t)+' min</div><div class="k">'
      +   ses.main.filter(function(i){return i.done}).length+' of '+ses.main.length+' done</div></div>'
      + '<button class="dbtn" data-act="shuffle">Shuffle</button>'
      + '<button class="dbtn timer" data-act="opentimer">Rest timer</button>'
      + '</div>';
  } else {
    d.innerHTML = '<div class="dockin"><div class="dockstat"><div class="v">No session yet</div>'
      + '<div class="k">Choose what you are training</div></div></div>';
  }
}

function renderData(){
  var sessions = Object.keys(S.history).reduce(function(a,g){return a+S.history[g].length},0);
  var logs = Object.keys(S.logs).length;
  var d=$("#dnum");
  if(!d) return;
  d.innerHTML =
      '<div class="drow"><span>Saving to</span><b>'+STORE.name+'</b></div>'
    + '<div class="drow"><span>Sessions kept</span><b>'+sessions+'</b></div>'
    + '<div class="drow"><span>Exercises logged</span><b>'+logs+'</b></div>'
    + (STORE.warn ? '<p class="dwarn">'+STORE.warn+'</p>' : '')
    + (dmsg ? '<p class="dmsg">'+dmsg+'</p>' : '');
}
var dmsg="";

function render(){
  document.documentElement.setAttribute("data-theme",S.theme);
  renderNav(); renderPicker();
  if(S.view==="browse") renderBrowse(); else renderSession();
  renderDock(); renderData();
}

/* ============================================================
   REST TIMER
   ============================================================ */
var T = {sec:90, left:90, on:false, iv:null, C:603.19};
function timerPaint(){
  $("#tnum").textContent = mmss(T.left);
  $("#tring").style.strokeDashoffset = String(T.C*(1-(T.left/T.sec||0)));
  $("#tgo").textContent = T.on ? "Pause" : (T.left<T.sec ? "Resume" : "Start");
  Array.prototype.forEach.call(document.querySelectorAll("[data-pre]"),function(b){
    b.classList.toggle("on", Number(b.dataset.pre)===T.sec);
  });
}
function timerSet(s){T.sec=s;T.left=s;timerStop();timerPaint()}
function timerStop(){T.on=false;clearInterval(T.iv);T.iv=null}
function timerStart(){
  if(T.left<=0) T.left=T.sec;
  T.on=true; clearInterval(T.iv);
  T.iv=setInterval(function(){
    T.left--; 
    if(T.left<=0){ T.left=0; timerStop(); beep(); }
    timerPaint();
  },1000);
  timerPaint();
}
function beep(){
  try{
    if(navigator.vibrate) navigator.vibrate([220,120,220]);
    var ac=new (window.AudioContext||window.webkitAudioContext)();
    [0,0.28].forEach(function(off){
      var o=ac.createOscillator(),g=ac.createGain();
      o.type="sine"; o.frequency.value=880;
      g.gain.setValueAtTime(0.0001,ac.currentTime+off);
      g.gain.exponentialRampToValueAtTime(0.35,ac.currentTime+off+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+off+0.22);
      o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+off);o.stop(ac.currentTime+off+0.24);
    });
  }catch(e){}
}
function openTimer(sec){
  if(sec) timerSet(sec);
  $("#sheet").classList.add("on");
  timerPaint();
}

/* ============================================================
   WIRING
   ============================================================ */
function newSession(group,keepAvoid){
  var avoid = keepAvoid && S.session && S.session.mode!=="multi" && S.session.group===group
    ? S.session.main.map(function(i){return i.id}) : [];
  S.session = buildSession(group,avoid);
  S.group = group; S.mode="single"; notice=null;
  save(); render(); toTop();
}
function newMulti(keepAvoid){
  if(!S.sel.length) return;
  var avoid = keepAvoid && S.session && S.session.mode==="multi"
    ? S.session.main.map(function(i){return i.id}) : [];
  S.session = buildMulti(S.sel, S.level, S.finisher, avoid);
  notice=null; save(); render(); toTop();
}
function toTop(){ try{ window.scrollTo(0,0) }catch(e){} }

document.addEventListener("click",function(e){
  var b = e.target.closest("[data-act]"); if(!b) return;
  var act=b.dataset.act, i=Number(b.dataset.i);
  var ses=S.session;

  if(act==="tab"){ S.view=b.dataset.v; S.open=""; save(); render(); toTop(); return }
  if(act==="mode"){ S.mode=b.dataset.m; save(); render(); return }
  if(act==="level"){ S.level=b.dataset.l; save(); render(); return }
  if(act==="fin"){ S.finisher=!S.finisher; save(); render(); return }
  if(act==="msel"){
    var g=b.dataset.g, ix=S.sel.indexOf(g);
    if(ix>=0) S.sel.splice(ix,1); else S.sel.push(g);
    save(); render(); return;
  }
  if(act==="preset"){ S.sel=PRESETS[Number(b.dataset.p)].sel.slice(); save(); render(); return }
  if(act==="buildmulti"){ newMulti(false); return }
  if(act==="bf"){ S.bf[b.dataset.k]=b.dataset.v; S.open=""; save(); render(); return }
  if(act==="expand"){ S.open = (S.open===b.dataset.id) ? "" : b.dataset.id; renderBrowse(); return }

  if(act==="build"){
    var gv=$("#group").value; if(!gv) return;
    newSession(gv, !!(S.session && S.session.mode!=="multi" && S.session.group===gv));
  }
  if(act==="shuffle" && ses){ ses.mode==="multi" ? newMulti(true) : newSession(ses.group,true) }
  if(act==="swap" && ses){
    var r = swapOne(i);
    if(r){
      var t=totalTime(ses);
      notice = "Swapped in " + r.name + ". "
        + (Math.abs(t-5400)>6*60
            ? "The session is now about " + mins(t) + " minutes \u2014 adjust sets if that does not fit."
            : "Session still runs about " + mins(t) + " minutes.");
      save(); render();
    }
  }
  if(act==="done" && ses){
    ses.main[i].done = !ses.main[i].done;
    if(ses.main.filter(function(x){return x.done}).length>=Math.ceil(ses.main.length/2)) commitHistory();
    save(); render();
  }
  if(act==="rest" && ses){ openTimer(ses.main[i].rest) }
  if(act==="opentimer"){ openTimer(0) }
  if(act==="closenote"){ notice=null; render() }
  if(act==="finish" && ses){ commitHistory(); render() }
  if(act==="theme"){ S.theme = S.theme==="dark"?"light":"dark"; save(); render() }

  if(act==="opendata"){ dmsg=""; renderData(); $("#data").classList.add("on") }
  if(act==="dclose"){ dmsg=""; $("#data").classList.remove("on"); render() }
  if(act==="export"){
    dmsg = exportData()
      ? "Backup downloaded. Keep it in Drive, Files or anywhere you like \u2014 importing it later restores everything."
      : "Could not start the download here. Open the file in your own browser and try again.";
    renderData();
  }
  if(act==="wipe"){
    if(b.dataset.armed){ wipeData(); dmsg="All history and logs cleared."; $("#data").classList.remove("on"); render(); }
    else { b.dataset.armed="1"; b.textContent="Tap again to confirm"; b.classList.add("danger") }
  }
  if(act==="tclose"){ $("#sheet").classList.remove("on") }
  if(act==="tgo"){ T.on?timerStop():timerStart(); timerPaint() }
  if(act==="treset"){ timerSet(T.sec) }
  if(act==="tplus"){ T.left+=15; T.sec=Math.max(T.sec,T.left); timerPaint() }
});

document.addEventListener("click",function(e){
  var p=e.target.closest("[data-pre]"); if(!p) return;
  timerSet(Number(p.dataset.pre));
});

document.addEventListener("change",function(e){
  var el=e.target;
  if(el.id==="group"){ if(el.value) newSession(el.value,false); return }
  if(el.dataset && el.dataset.log!==undefined){
    var i=Number(el.dataset.log), s=Number(el.dataset.set), f=Number(el.dataset.f);
    var it=S.session.main[i];
    it.log = it.log || [];
    it.log[s] = it.log[s] || ["",""];
    it.log[s][f] = el.value;
    S.logs[byId(it.g,it.id).id] = {d:Date.now(), s:it.log.map(function(r){return r.slice()})};
    save();
  }
});

$("#sheet").addEventListener("click",function(e){
  if(e.target.id==="sheet") $("#sheet").classList.remove("on");
});
$("#data").addEventListener("click",function(e){
  if(e.target.id==="data"){ dmsg=""; $("#data").classList.remove("on"); render() }
});
$("#importfile").addEventListener("change",function(e){
  var f=e.target.files && e.target.files[0]; if(!f) return;
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var added = mergeData(JSON.parse(fr.result));
      dmsg = "Merged. "+added.logs+" exercise log"+(added.logs===1?"":"s")+" and "
           + added.sessions+" session"+(added.sessions===1?"":"s")+" added.";
      render();
    }catch(err){ dmsg="That file could not be read as a backup."; renderData() }
  };
  fr.readAsText(f);
  e.target.value="";
});

(async function(){
  await load();
  render(); timerPaint();
})();
</script>
</body>
